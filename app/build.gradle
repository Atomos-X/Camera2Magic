import com.android.build.api.variant.FilterConfiguration
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

// 版本控制变量 version for camera3
def majorVersion = 1
def minorVersion = 1
def patchVersion = 0
def versionCodeOffset = 0 // 保持与旧版本兼容的偏移量

def getGitCommitHash = { ->
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

def getGitCommitCount = { ->
    try {
        def count = 'git rev-list --count HEAD'.execute().text.trim()
        return count.isEmpty() ? 1 : count.toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

def gitCommitHash = getGitCommitHash()
def gitCommitCount = getGitCommitCount()

def startTasks = gradle.startParameter.taskNames
def isExplicitNativeBuild = startTasks.any { it.contains("buildNative") }

android {
    flavorDimensions.add("api")

    productFlavors {
        register("legacy") { dimension = "api" }
        register("modern") { dimension = "api" }
    }

    namespace 'com.nothing.camera2magic'
    compileSdk {
        version = release(36)
    }
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId "com.nothing.camera2magic"
        minSdk 29
        targetSdk 36

//        ndk {
//            abiFilters "armeabi-v7a", "arm64-v8a"
//        }
        // versionCode = 偏移量 + Git提交次数，确保比旧版本大
        versionCode versionCodeOffset + gitCommitCount
        versionName "${majorVersion}.${minorVersion}.${patchVersion}"

        externalNativeBuild {
            cmake {
                cppFlags += ""
                arguments "-DANDROID_PLATFORM=android-29"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable true
            reset()
            include ("armeabi-v7a", "arm64-v8a")
            universalApk false
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 自定义生成的 APK 文件名
    androidComponents {
        onVariants(selector().all(), { variant ->
            variant.outputs.each { output ->
                def abi = output.filters.find {
                    it.filterType == FilterConfiguration.FilterType.ABI
                }?.identifier
                def flavor = variant.flavorName
                def fileName = "CAM2Magic-${majorVersion}.${minorVersion}.${patchVersion}a-${abi}.apk"
                output.outputFileName.set(fileName)
            }
        })
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    buildFeatures {
        compose true
        aidl true
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += ["src/main/jniLibs"]
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        jniLibs.pickFirsts.add("**/libcamera3.so")
    }
}

afterEvaluate {
    if (!isExplicitNativeBuild) {
        def jniLibTree = fileTree(dir: "src/main/jniLibs", include: "**/libcamera3.so")
        if (jniLibTree.isEmpty()) {
            println ">>> [警告] jniLibs 文件不存在， 无法快速编译 <<<"
            return
        }

        println ">>> 模式: 快速编译 (C++ 编译已禁用，使用 jniLibs) <<<"
        // 1. 禁用 CMake 和 Strip 任务
        tasks.matching { task ->
            (task.name.startsWith("buildCMake") || task.name.startsWith("externalNativeBuild")) &&
                    !task.name.contains("generateJsonModel")
        }.configureEach { task ->
            task.enabled = false
        }
    }
}

tasks.register("buildNative", Copy) {
    group = "native"
    description = "编译 C++ 产物并同步到 jniLibs (基于 Modern Release)"

    def targetVariant = "modernRelease"
    def stripTaskName = "stripModernReleaseDebugSymbols"

    dependsOn stripTaskName
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    doFirst {
        delete("src/main/jniLibs")
        delete("release/")
        delete(".cxx")
        println ">>> 已清理旧的 jniLibs 目录和 C++ 缓存 <<<"
        println ">>> 模式: Native 构建 (基于 ${targetVariant} 编译 C++ 并更新 jniLibs) <<<"
    }

    def startDir = layout.buildDirectory.dir("intermediates/stripped_native_libs/${targetVariant}/${stripTaskName}/out/lib")

    from(startDir) {
        include("**/libcamera3.so")
    }

    includeEmptyDirs = false
    into("src/main/jniLibs")
}

dependencies {
    legacyCompileOnly "de.robv.android.xposed:api:82"
    modernCompileOnly 'io.github.libxposed:api:101.0.1'
    modernImplementation 'io.github.libxposed:service:101.0.0'
