// 版本控制变量
def majorVersion = 0
def minorVersion = 8
def patchVersion = 6
def versionCodeOffset = 57225 // 保持与旧版本兼容的偏移量

def getGitCommitHash = { ->
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

def getGitCommitCount = { ->
    try {
        def count = 'git rev-list --count HEAD'.execute().text.trim()
        return count.isEmpty() ? 1 : count.toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

def gitCommitHash = getGitCommitHash()
def gitCommitCount = getGitCommitCount()

def startTasks = gradle.startParameter.taskNames
def isExplicitNativeBuild = startTasks.any { it.contains("buildNative") }

android {
    namespace 'com.nothing.camera2magic'
    compileSdk {
        version = release(36)
    }
    ndkVersion = "27.0.12077973"

    defaultConfig {
        applicationId "com.nothing.camera2magic"
        minSdk 29
        targetSdk 36
        // versionCode = 偏移量 + Git提交次数，确保比旧版本大
        versionCode versionCodeOffset + gitCommitCount
        versionName "${majorVersion}.${minorVersion}.${patchVersion}"

        externalNativeBuild {
            cmake {
                cppFlags += ""
                arguments "-DANDROID_PLATFORM=android-29"
            }
        }

        ndk {
            abiFilters.addAll(["arm64-v8a"])
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 自定义生成的 APK 文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def fileName = "CAM2Magic-${majorVersion}.${minorVersion}.${patchVersion}.${gitCommitHash}.apk"
            output.outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += ["src/main/jniLibs"]
            }
        }
    }

    packaging {
        jniLibs.pickFirsts.add("**/libcamera_magic.so")
    }
}

afterEvaluate {
    if (!isExplicitNativeBuild) {
        def jniLibFile = file("src/main/jniLibs/arm64-v8a/libcamera_magic.so")
        if (!jniLibFile.exists()) {
            println ">>> [警告] jniLibs 文件不存在， 无法快速编译 <<<"
            return
        }

        println ">>> 模式: 快速编译 (C++ 编译已禁用，使用 jniLibs) <<<"
        // 1. 禁用 CMake 和 Strip 任务
        tasks.matching { task ->
            (task.name.startsWith("buildCMake") || task.name.startsWith("externalNativeBuild")) &&
                    !task.name.contains("generateJsonModel")
        }.configureEach { task ->
            task.enabled = false
        }
    }
}

android.applicationVariants.all { variant ->

    def variantName = variant.name.capitalize() // "Debug" 或 "Release"

    tasks.register("buildNative${variantName}", Copy) {

        doFirst {
            delete "src/main/jniLibs/"
            delete "release/"
            delete ".cxx"
            println ">>> 已清理手动生成的 jniLibs 目录 <<<"
        }

        group = "native"
        description = "为 ${variant.name} 编译并同步 C++ 产物"
        // 动态匹配当前变体的路径
        def stripTask = "strip${variantName}DebugSymbols"
        println ">>> 模式: Native 构建 (正在编译 C++ 并更新 jniLibs) <<<"
        dependsOn stripTask
        outputs.upToDateWhen { false }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        def startDir = layout.buildDirectory.dir("intermediates/stripped_native_libs/${variant.name}/${stripTask}/out/lib")

        from(startDir) {
            include("**/libcamera_magic.so")
        }

        includeEmptyDirs = false

        into("src/main/jniLibs")
    }
}

